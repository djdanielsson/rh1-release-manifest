---
# Release Manifest Template
# Copy to releases/release-YY.M.D-PATCH.yaml or use the release pipeline
version: "YY.M.D-PATCH"
created: "YYYY-MM-DDTHH:MM:SSZ"
created_by: "username"
description: "Brief description of this release"

components:
  playbooks:
    repository: "https://github.com/djdanielsson/rh1-automation-playbooks.git"
    commit: "full-40-character-git-sha"
    tag: "YY.M.D-PATCH"
  collections:
    repository: "https://github.com/djdanielsson/rh1-custom-collection.git"
    commit: "full-40-character-git-sha"
    tag: "YY.M.D-PATCH"
  execution_environment:
    registry: "quay.io"
    repository: "myorg/custom-ee"
    tag: "YY.M.D-PATCH"
    digest: "sha256:full-64-character-image-digest"
  aap_configuration:
    repository: "https://github.com/djdanielsson/rh1-aap-config-as-code.git"
    commit: "full-40-character-git-sha"

# Version mappings for aap-config-as-code files
# The promote pipeline updates these files with the versions below
version_mappings:
  jt_plat_configure_webserver:
    project_version: "YY.M.D-PATCH"
    ee_version: "YY.M.D-PATCH"
  jt_plat_configure_database:
    project_version: "YY.M.D-PATCH"
    ee_version: "YY.M.D-PATCH"
  jt_plat_configure_monitoring:
    project_version: "YY.M.D-PATCH"
    ee_version: "YY.M.D-PATCH"
  jt_plat_backup_database:
    project_version: "YY.M.D-PATCH"
    ee_version: "YY.M.D-PATCH"

environments:
  dev:
    deployed: null
    validated: false
  qa:
    deployed: null
    validated: false
  prod:
    deployed: null
    validated: false

validation:
  tests_required: [smoke-tests, integration-tests, security-scan]
  tests_passed: []
  approval_required: true
  approved_by: null

metadata:
  jira_ticket: ""
  pull_requests: []

rollback_history: []
