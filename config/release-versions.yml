---
# release-versions.yml
# =====================================================================
# RELEASE VERSION CONFIGURATION
# =====================================================================
# This file defines the version/tag mappings for all versioned resources.
# Updated by the release pipeline when a new release is created.
#
# The promote pipeline reads this file and applies the versions to the
# corresponding resources in aap-config-as-code when deploying.
#
# Naming Convention for variables:
#   <resource_type>_<org>_<name>_version
#
# These map to the file naming convention in aap-config-as-code:
#   jt_<org>_<name>.yml → uses project_<org>_<name>_version and ee_<org>_<name>_version
# =====================================================================

# ---------------------------------------------------------------------
# EXECUTION ENVIRONMENT VERSIONS
# ---------------------------------------------------------------------
# Format: ee_<org>_<name>_version
# These control the EE image tags used by job templates

ee_plat_automation_version: "26.1.15-0"

# ---------------------------------------------------------------------
# PROJECT VERSIONS (Git Tags/Branches)
# ---------------------------------------------------------------------
# Format: project_<org>_<name>_version
# These control the scm_branch for projects

# Playbooks repository projects
project_plat_webserver_config_playbooks_version: "26.1.15-0"
project_plat_database_config_playbooks_version: "26.1.15-0"
project_plat_monitoring_config_playbooks_version: "26.1.15-0"
project_plat_backup_config_playbooks_version: "26.1.15-0"

# ---------------------------------------------------------------------
# COLLECTION VERSIONS
# ---------------------------------------------------------------------
# Format: collection_<namespace>_<name>_version

collection_myorg_custom_collection_version: "26.1.15-0"

# ---------------------------------------------------------------------
# CURRENT RELEASE METADATA
# ---------------------------------------------------------------------

current_version: "26.1.15-0"
created_at: "2026-01-15T00:00:00Z"
created_by: "tekton-pipeline"
...
