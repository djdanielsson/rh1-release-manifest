---
name: Validate Release Manifests

on:
  push:
    branches: ['**']
    paths:
      - 'releases/**/*.yaml'
  pull_request:
    branches: [main, master]
    paths:
      - 'releases/**/*.yaml'

jobs:
  validate-manifests:
    name: Validate Release Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyyaml yamllint
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Validate YAML syntax
        run: yamllint -c .yamllint releases/

      - name: Run validation script
        run: ./scripts/validate-manifest.sh releases/

  validate-scripts:
    name: Validate Helper Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Validate shell scripts
        run: |
          for script in scripts/*.sh; do
            if [ -f "$script" ]; then
              echo "Validating $script..."
              shellcheck "$script" || true
            fi
          done

      - name: Test scripts exist
        run: |
          required_scripts=("create-manifest.sh" "validate-manifest.sh" "promote.sh")
          for script in "${required_scripts[@]}"; do
            if [ ! -f "scripts/$script" ]; then
              echo "⚠️  WARNING: Expected script not found: scripts/$script"
            else
              echo "✅ Found scripts/$script"
            fi
          done

  pr-summary:
    name: Generate PR Summary
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [validate-manifests, validate-scripts]
    steps:
      - name: Generate summary
        run: |
          echo "# Release Manifest Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Release Manifests | ${{ needs.validate-manifests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Helper Scripts | ${{ needs.validate-scripts.result }} |" >> $GITHUB_STEP_SUMMARY
