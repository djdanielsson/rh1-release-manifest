---
apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: promote
  labels:
    app.kubernetes.io/component: release-management
spec:
  description: |
    Promotes a release from one environment to the next.
    Validates the release, applies configuration, and records deployment.
  params:
    - name: VERSION
      type: string
      description: Release version to promote (YY.M.D-PATCH format)
    - name: FROM_ENVIRONMENT
      type: string
      description: Source environment (dev, qa)
    - name: TO_ENVIRONMENT
      type: string
      description: Target environment (qa, prod)
    - name: REQUIRE_APPROVAL
      type: string
      description: Require manual approval before promoting to prod
      default: "true"

  workspaces:
    - name: source
      description: Workspace for release-manifest repo
    - name: aap-config
      description: Workspace for aap-config-as-code checkout

  results:
    - name: deployed-time
      description: Deployment timestamp
      value: $(tasks.deploy.results.deployed)

  tasks:
    - name: clone-release-manifest
      taskRef:
        name: git-clone
        kind: ClusterTask
      workspaces:
        - name: output
          workspace: source
      params:
        - name: url
          value: https://github.com/djdanielsson/rh1-release-manifest.git
        - name: revision
          value: main

    - name: validate-promotion-path
      runAfter:
        - clone-release-manifest
      taskSpec:
        params:
          - name: FROM
            type: string
          - name: TO
            type: string
        steps:
          - name: validate
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            script: |
              #!/usr/bin/env bash
              set -e
              
              FROM="$(params.FROM)"
              TO="$(params.TO)"
              
              echo "Validating promotion path: $FROM → $TO"
              
              # Valid promotion paths
              if [ "$FROM" == "dev" ] && [ "$TO" == "qa" ]; then
                echo "✅ Valid: dev → qa"
              elif [ "$FROM" == "qa" ] && [ "$TO" == "prod" ]; then
                echo "✅ Valid: qa → prod"
              else
                echo "❌ Invalid promotion path: $FROM → $TO"
                echo "Valid paths:"
                echo "  - dev → qa"
                echo "  - qa → prod"
                exit 1
              fi
      params:
        - name: FROM
          value: $(params.FROM_ENVIRONMENT)
        - name: TO
          value: $(params.TO_ENVIRONMENT)

    - name: check-source-deployment
      runAfter:
        - validate-promotion-path
      taskSpec:
        params:
          - name: VERSION
            type: string
          - name: FROM_ENV
            type: string
        workspaces:
          - name: source
        results:
          - name: validated
            description: Whether source deployment was validated
          - name: aap-commit
            description: AAP config commit from manifest
        steps:
          - name: check
            image: quay.io/centos/centos:stream9-minimal
            script: |
              #!/usr/bin/env bash
              set -e
              
              # Install yq
              curl -sL https://github.com/mikefarah/yq/releases/download/v4.40.5/yq_linux_amd64 -o /usr/local/bin/yq
              chmod +x /usr/local/bin/yq
              
              MANIFEST="$(workspaces.source.path)/releases/release-$(params.VERSION).yaml"
              
              if [ ! -f "$MANIFEST" ]; then
                echo "❌ Manifest not found: $MANIFEST"
                exit 1
              fi
              
              # Check if deployed to source environment
              DEPLOYED=$(yq eval ".environments.$(params.FROM_ENV).deployed" "$MANIFEST")
              
              if [ "$DEPLOYED" == "null" ]; then
                echo "❌ Version $(params.VERSION) has not been deployed to $(params.FROM_ENV)"
                exit 1
              fi
              
              echo "✅ Version was deployed to $(params.FROM_ENV) at: $DEPLOYED"
              
              # Check if validated
              VALIDATED=$(yq eval ".environments.$(params.FROM_ENV).validated" "$MANIFEST")
              echo "$VALIDATED" > $(results.validated.path)
              
              if [ "$VALIDATED" != "true" ]; then
                echo "⚠️  Warning: Version not marked as validated in $(params.FROM_ENV)"
              fi
              
              # Get AAP commit
              AAP_COMMIT=$(yq eval '.components.aap_configuration.commit' "$MANIFEST")
              echo -n "$AAP_COMMIT" > $(results.aap-commit.path)
      params:
        - name: VERSION
          value: $(params.VERSION)
        - name: FROM_ENV
          value: $(params.FROM_ENVIRONMENT)
      workspaces:
        - name: source
          workspace: source

    - name: require-prod-approval
      runAfter:
        - check-source-deployment
      when:
        - input: $(params.TO_ENVIRONMENT)
          operator: in
          values: ["prod"]
        - input: $(params.REQUIRE_APPROVAL)
          operator: in
          values: ["true"]
      taskSpec:
        steps:
          - name: check-approval
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            script: |
              #!/usr/bin/env bash
              
              echo "╔════════════════════════════════════════════════════════════════════╗"
              echo "║              PRODUCTION PROMOTION REQUIRES APPROVAL                 ║"
              echo "╠════════════════════════════════════════════════════════════════════╣"
              echo "║                                                                    ║"
              echo "║  This pipeline requires manual approval for production.            ║"
              echo "║  Use Tekton Dashboard or CLI to approve/reject.                    ║"
              echo "║                                                                    ║"
              echo "║  To skip approval check, set REQUIRE_APPROVAL=false                ║"
              echo "║                                                                    ║"
              echo "╚════════════════════════════════════════════════════════════════════╝"
              
              # In a real implementation, this would use Tekton custom tasks
              # or integrate with an approval system
              echo "Approval check passed (auto-approve for non-prod)"

    - name: deploy
      runAfter:
        - check-source-deployment
        - require-prod-approval
      taskRef:
        name: promote-environment
      params:
        - name: VERSION
          value: $(params.VERSION)
        - name: ENVIRONMENT
          value: $(params.TO_ENVIRONMENT)
        - name: AAP_CONFIG_COMMIT
          value: $(tasks.check-source-deployment.results.aap-commit)
      workspaces:
        - name: source
          workspace: source
        - name: aap-config
          workspace: aap-config

    - name: commit-promotion
      runAfter:
        - deploy
      taskSpec:
        params:
          - name: VERSION
            type: string
          - name: FROM
            type: string
          - name: TO
            type: string
        workspaces:
          - name: source
        steps:
          - name: commit
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            script: |
              #!/usr/bin/env bash
              set -e
              
              cd $(workspaces.source.path)
              
              git config user.email "tekton@pipeline.local"
              git config user.name "Tekton Pipeline"
              
              git add releases/
              git commit -m "Promote $(params.VERSION): $(params.FROM) → $(params.TO)
              
              Pipeline: promote
              " || echo "No changes to commit"
              
              echo "✅ Promotion recorded"
      params:
        - name: VERSION
          value: $(params.VERSION)
        - name: FROM
          value: $(params.FROM_ENVIRONMENT)
        - name: TO
          value: $(params.TO_ENVIRONMENT)
      workspaces:
        - name: source
          workspace: source

  finally:
    - name: summary
      taskSpec:
        params:
          - name: VERSION
            type: string
          - name: FROM
            type: string
          - name: TO
            type: string
        steps:
          - name: print
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            script: |
              #!/usr/bin/env bash
              
              echo ""
              echo "╔════════════════════════════════════════════════════════════════════╗"
              echo "║                      PROMOTION COMPLETE                             ║"
              echo "╠════════════════════════════════════════════════════════════════════╣"
              echo "║  Version:     $(params.VERSION)"
              echo "║  Path:        $(params.FROM) → $(params.TO)"
              echo "║  Status:      $(context.pipelineRun.status)"
              echo "╚════════════════════════════════════════════════════════════════════╝"
      params:
        - name: VERSION
          value: $(params.VERSION)
        - name: FROM
          value: $(params.FROM_ENVIRONMENT)
        - name: TO
          value: $(params.TO_ENVIRONMENT)


