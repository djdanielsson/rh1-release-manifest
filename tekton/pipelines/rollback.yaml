---
apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: rollback
  labels:
    app.kubernetes.io/component: release-management
spec:
  description: |
    Rolls back an environment to a previous release version.
    Uses the release manifest to identify exact component versions
    and applies the configuration using ansible-playbook.
  params:
    - name: TARGET_VERSION
      type: string
      description: Version to roll back to (YY.M.D-PATCH format)
    - name: ENVIRONMENT
      type: string
      description: Target environment (dev, qa, prod)
    - name: REASON
      type: string
      description: Reason for rollback
      default: "Manual rollback requested"
    - name: DRY_RUN
      type: string
      description: If 'true', only validate without applying changes
      default: "false"

  workspaces:
    - name: source
      description: Workspace for release-manifest repo
    - name: aap-config
      description: Workspace for aap-config-as-code checkout

  results:
    - name: previous-version
      description: Version that was replaced
      value: $(tasks.rollback.results.previous-version)
    - name: rollback-time
      description: Timestamp of rollback
      value: $(tasks.rollback.results.rollback-time)

  tasks:
    - name: clone-release-manifest
      taskRef:
        name: git-clone
        kind: ClusterTask
      workspaces:
        - name: output
          workspace: source
      params:
        - name: url
          value: https://github.com/djdanielsson/rh1-release-manifest.git
        - name: revision
          value: main

    - name: validate-version
      runAfter:
        - clone-release-manifest
      taskRef:
        name: validate-version
      params:
        - name: VERSION
          value: $(params.TARGET_VERSION)

    - name: validate-environment
      runAfter:
        - clone-release-manifest
      taskSpec:
        params:
          - name: ENVIRONMENT
            type: string
        steps:
          - name: validate
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            script: |
              #!/usr/bin/env bash
              set -e
              
              ENV="$(params.ENVIRONMENT)"
              
              case "$ENV" in
                dev|qa|prod)
                  echo "✅ Valid environment: $ENV"
                  ;;
                *)
                  echo "❌ Invalid environment: $ENV"
                  echo "Must be one of: dev, qa, prod"
                  exit 1
                  ;;
              esac
      params:
        - name: ENVIRONMENT
          value: $(params.ENVIRONMENT)

    - name: check-manifest-exists
      runAfter:
        - validate-version
        - validate-environment
      taskSpec:
        params:
          - name: VERSION
            type: string
        workspaces:
          - name: source
        results:
          - name: manifest-path
            description: Path to manifest file
          - name: aap-commit
            description: AAP config commit from manifest
        steps:
          - name: check
            image: quay.io/centos/centos:stream9-minimal
            script: |
              #!/usr/bin/env bash
              set -e
              
              # Install yq
              curl -sL https://github.com/mikefarah/yq/releases/download/v4.40.5/yq_linux_amd64 -o /usr/local/bin/yq
              chmod +x /usr/local/bin/yq
              
              MANIFEST="$(workspaces.source.path)/releases/release-$(params.VERSION).yaml"
              
              if [ ! -f "$MANIFEST" ]; then
                echo "❌ Release manifest not found: $MANIFEST"
                echo ""
                echo "Available releases:"
                ls -la $(workspaces.source.path)/releases/ | grep -E "release-[0-9]"
                exit 1
              fi
              
              echo "✅ Found manifest: $MANIFEST"
              echo "$MANIFEST" > $(results.manifest-path.path)
              
              # Extract AAP commit
              AAP_COMMIT=$(yq eval '.components.aap_configuration.commit' "$MANIFEST")
              echo "AAP Config commit: $AAP_COMMIT"
              echo -n "$AAP_COMMIT" > $(results.aap-commit.path)
      params:
        - name: VERSION
          value: $(params.TARGET_VERSION)
      workspaces:
        - name: source
          workspace: source

    - name: dry-run-check
      runAfter:
        - check-manifest-exists
      when:
        - input: $(params.DRY_RUN)
          operator: in
          values: ["true"]
      taskSpec:
        params:
          - name: VERSION
            type: string
          - name: ENVIRONMENT
            type: string
          - name: MANIFEST_PATH
            type: string
        steps:
          - name: dry-run-summary
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            script: |
              #!/usr/bin/env bash
              
              echo ""
              echo "╔════════════════════════════════════════════════════════════════════╗"
              echo "║                    DRY RUN - NO CHANGES MADE                        ║"
              echo "╠════════════════════════════════════════════════════════════════════╣"
              echo "║  Would roll back:"
              echo "║    Environment: $(params.ENVIRONMENT)"
              echo "║    To Version:  $(params.VERSION)"
              echo "║    Manifest:    $(params.MANIFEST_PATH)"
              echo "╚════════════════════════════════════════════════════════════════════╝"
      params:
        - name: VERSION
          value: $(params.TARGET_VERSION)
        - name: ENVIRONMENT
          value: $(params.ENVIRONMENT)
        - name: MANIFEST_PATH
          value: $(tasks.check-manifest-exists.results.manifest-path)

    - name: rollback
      runAfter:
        - check-manifest-exists
      when:
        - input: $(params.DRY_RUN)
          operator: notin
          values: ["true"]
      taskRef:
        name: rollback
      params:
        - name: TARGET_VERSION
          value: $(params.TARGET_VERSION)
        - name: ENVIRONMENT
          value: $(params.ENVIRONMENT)
        - name: REASON
          value: $(params.REASON)
      workspaces:
        - name: source
          workspace: source
        - name: aap-config
          workspace: aap-config

    - name: commit-rollback
      runAfter:
        - rollback
      when:
        - input: $(params.DRY_RUN)
          operator: notin
          values: ["true"]
      taskSpec:
        params:
          - name: VERSION
            type: string
          - name: ENVIRONMENT
            type: string
          - name: REASON
            type: string
        workspaces:
          - name: source
        steps:
          - name: commit
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            script: |
              #!/usr/bin/env bash
              set -e
              
              cd $(workspaces.source.path)
              
              git config user.email "tekton@pipeline.local"
              git config user.name "Tekton Pipeline"
              
              git add releases/
              git commit -m "Rollback $(params.ENVIRONMENT) to $(params.VERSION)
              
              Reason: $(params.REASON)
              Pipeline: rollback
              " || echo "No changes to commit"
              
              echo "✅ Rollback recorded in manifest"
      params:
        - name: VERSION
          value: $(params.TARGET_VERSION)
        - name: ENVIRONMENT
          value: $(params.ENVIRONMENT)
        - name: REASON
          value: $(params.REASON)
      workspaces:
        - name: source
          workspace: source

  finally:
    - name: notify
      taskSpec:
        params:
          - name: VERSION
            type: string
          - name: ENVIRONMENT
            type: string
          - name: REASON
            type: string
        steps:
          - name: summary
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            script: |
              #!/usr/bin/env bash
              
              echo ""
              echo "╔════════════════════════════════════════════════════════════════════╗"
              echo "║                      ROLLBACK PIPELINE COMPLETE                     ║"
              echo "╠════════════════════════════════════════════════════════════════════╣"
              echo "║  Target Version: $(params.VERSION)"
              echo "║  Environment:    $(params.ENVIRONMENT)"
              echo "║  Reason:         $(params.REASON)"
              echo "║  Status:         $(context.pipelineRun.status)"
              echo "╚════════════════════════════════════════════════════════════════════╝"
              echo ""
              echo "Next steps:"
              echo "  1. Verify the rollback in AAP UI"
              echo "  2. Run smoke tests"
              echo "  3. Push manifest changes: git push origin main"
      params:
        - name: VERSION
          value: $(params.TARGET_VERSION)
        - name: ENVIRONMENT
          value: $(params.ENVIRONMENT)
        - name: REASON
          value: $(params.REASON)


