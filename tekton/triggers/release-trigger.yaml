---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: create-release-template
  labels:
    app.kubernetes.io/component: release-management
spec:
  params:
    - name: version
      description: Release version
    - name: description
      description: Release description
      default: ""
  resourcetemplates:
    - apiVersion: tekton.dev/v1beta1
      kind: PipelineRun
      metadata:
        generateName: create-release-$(tt.params.version)-
        labels:
          tekton.dev/pipeline: create-release
          release.version: $(tt.params.version)
      spec:
        pipelineRef:
          name: create-release
        params:
          - name: VERSION
            value: $(tt.params.version)
          - name: DESCRIPTION
            value: $(tt.params.description)
        workspaces:
          - name: source
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 1Gi
          - name: aap-config-source
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 500Mi
          - name: collection-source
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 500Mi
          - name: shared-data
            emptyDir: {}

---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: rollback-template
  labels:
    app.kubernetes.io/component: release-management
spec:
  params:
    - name: version
      description: Target version to rollback to
    - name: environment
      description: Target environment
    - name: reason
      description: Rollback reason
      default: "Manual rollback"
  resourcetemplates:
    - apiVersion: tekton.dev/v1beta1
      kind: PipelineRun
      metadata:
        generateName: rollback-$(tt.params.environment)-$(tt.params.version)-
        labels:
          tekton.dev/pipeline: rollback
          release.version: $(tt.params.version)
          target.environment: $(tt.params.environment)
      spec:
        pipelineRef:
          name: rollback
        params:
          - name: TARGET_VERSION
            value: $(tt.params.version)
          - name: ENVIRONMENT
            value: $(tt.params.environment)
          - name: REASON
            value: $(tt.params.reason)
        workspaces:
          - name: source
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 1Gi
          - name: aap-config
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 500Mi

---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: promote-template
  labels:
    app.kubernetes.io/component: release-management
spec:
  params:
    - name: version
      description: Release version to promote
    - name: from_environment
      description: Source environment
    - name: to_environment
      description: Target environment
  resourcetemplates:
    - apiVersion: tekton.dev/v1beta1
      kind: PipelineRun
      metadata:
        generateName: promote-$(tt.params.version)-$(tt.params.to_environment)-
        labels:
          tekton.dev/pipeline: promote
          release.version: $(tt.params.version)
          target.environment: $(tt.params.to_environment)
      spec:
        pipelineRef:
          name: promote
        params:
          - name: VERSION
            value: $(tt.params.version)
          - name: FROM_ENVIRONMENT
            value: $(tt.params.from_environment)
          - name: TO_ENVIRONMENT
            value: $(tt.params.to_environment)
        workspaces:
          - name: source
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 1Gi
          - name: aap-config
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 500Mi

---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: manual-release-binding
  labels:
    app.kubernetes.io/component: release-management
spec:
  params:
    - name: version
      value: $(body.version)
    - name: description
      value: $(body.description)

---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: manual-rollback-binding
  labels:
    app.kubernetes.io/component: release-management
spec:
  params:
    - name: version
      value: $(body.version)
    - name: environment
      value: $(body.environment)
    - name: reason
      value: $(body.reason)

---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: manual-promote-binding
  labels:
    app.kubernetes.io/component: release-management
spec:
  params:
    - name: version
      value: $(body.version)
    - name: from_environment
      value: $(body.from_environment)
    - name: to_environment
      value: $(body.to_environment)

---
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: release-management-listener
  labels:
    app.kubernetes.io/component: release-management
spec:
  serviceAccountName: pipeline
  triggers:
    - name: create-release
      bindings:
        - ref: manual-release-binding
      template:
        ref: create-release-template
      interceptors:
        - ref:
            name: cel
          params:
            - name: filter
              value: "body.action == 'create-release'"

    - name: rollback
      bindings:
        - ref: manual-rollback-binding
      template:
        ref: rollback-template
      interceptors:
        - ref:
            name: cel
          params:
            - name: filter
              value: "body.action == 'rollback'"

    - name: promote
      bindings:
        - ref: manual-promote-binding
      template:
        ref: promote-template
      interceptors:
        - ref:
            name: cel
          params:
            - name: filter
              value: "body.action == 'promote'"

