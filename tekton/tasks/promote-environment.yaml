---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: promote-environment
  labels:
    app.kubernetes.io/component: release-management
spec:
  description: |
    Promotes a release to a target environment by applying AAP configuration.
  params:
    - name: VERSION
      type: string
      description: Release version to deploy
    - name: ENVIRONMENT
      type: string
      description: Target environment (dev, qa, prod)
    - name: AAP_CONFIG_COMMIT
      type: string
      description: AAP config commit to checkout
  workspaces:
    - name: source
      description: Workspace containing the release-manifest repo
    - name: aap-config
      description: Workspace for aap-config-as-code checkout
  results:
    - name: deployed
      description: Deployment timestamp
  steps:
    - name: checkout-aap-config
      image: registry.access.redhat.com/ubi9/ubi-minimal:latest
      script: |
        #!/usr/bin/env bash
        set -e
        
        echo "Checking out aap-config-as-code at $(params.AAP_CONFIG_COMMIT)"
        
        cd $(workspaces.aap-config.path)
        
        # Clone if not exists, otherwise fetch
        if [ ! -d ".git" ]; then
          git clone https://github.com/djdanielsson/rh1-aap-config-as-code.git .
        fi
        
        git fetch origin
        git checkout $(params.AAP_CONFIG_COMMIT)
        
        echo "✅ Checked out commit: $(git rev-parse HEAD)"

    - name: apply-configuration
      image: quay.io/ansible/ansible-runner:latest
      env:
        - name: CONTROLLER_HOST
          valueFrom:
            secretKeyRef:
              name: aap-$(params.ENVIRONMENT)-credentials
              key: host
        - name: CONTROLLER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: aap-$(params.ENVIRONMENT)-credentials
              key: password
        - name: CONTROLLER_USERNAME
          valueFrom:
            secretKeyRef:
              name: aap-$(params.ENVIRONMENT)-credentials
              key: username
              optional: true
      script: |
        #!/usr/bin/env bash
        set -e
        
        echo "╔════════════════════════════════════════════════════════════╗"
        echo "║  Promoting $(params.VERSION) to $(params.ENVIRONMENT)"
        echo "╚════════════════════════════════════════════════════════════╝"
        
        cd $(workspaces.aap-config.path)
        
        # Install collections
        ansible-galaxy collection install -r collections/requirements.yml
        
        # Run playbook for target environment
        ansible-playbook playbooks/playbook.yml \
          --limit aap_$(params.ENVIRONMENT) \
          -e "release_version=$(params.VERSION)"
        
        echo "✅ Configuration applied to $(params.ENVIRONMENT)"
        
        # Record deployment timestamp
        date -u +%Y-%m-%dT%H:%M:%SZ > $(results.deployed.path)

    - name: update-manifest
      image: quay.io/centos/centos:stream9-minimal
      script: |
        #!/usr/bin/env bash
        set -e
        
        # Install yq
        curl -sL https://github.com/mikefarah/yq/releases/download/v4.40.5/yq_linux_amd64 -o /usr/local/bin/yq
        chmod +x /usr/local/bin/yq
        
        MANIFEST="$(workspaces.source.path)/releases/release-$(params.VERSION).yaml"
        DEPLOYED_TIME=$(cat $(results.deployed.path))
        
        echo "Updating manifest with deployment info..."
        
        yq eval -i ".environments.$(params.ENVIRONMENT).deployed = \"$DEPLOYED_TIME\"" "$MANIFEST"
        yq eval -i ".environments.$(params.ENVIRONMENT).validated = false" "$MANIFEST"
        
        echo "✅ Manifest updated"

