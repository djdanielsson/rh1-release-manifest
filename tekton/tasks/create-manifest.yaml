---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: create-manifest
  labels:
    app.kubernetes.io/component: release-management
spec:
  description: |
    Creates a release manifest file with locked component versions.
  params:
    - name: VERSION
      type: string
      description: Release version (YY.MM.DD.PATCH format)
    - name: AAP_CONFIG_COMMIT
      type: string
      description: Full 40-char Git SHA for aap-config-as-code
    - name: COLLECTION_COMMIT
      type: string
      description: Full 40-char Git SHA for automation-collection-example
    - name: EE_TAG
      type: string
      description: Execution Environment image tag
    - name: EE_DIGEST
      type: string
      description: Execution Environment image digest (sha256:...)
    - name: DESCRIPTION
      type: string
      description: Release description
      default: ""
  workspaces:
    - name: source
      description: Workspace containing the release-manifest repo
  results:
    - name: manifest-path
      description: Path to the created manifest file
  steps:
    - name: create
      image: registry.access.redhat.com/ubi9/ubi-minimal:latest
      script: |
        #!/usr/bin/env bash
        set -e
        
        VERSION="$(params.VERSION)"
        MANIFEST_FILE="$(workspaces.source.path)/releases/release-${VERSION}.yaml"
        
        echo "Creating release manifest: $MANIFEST_FILE"
        
        # Check if manifest already exists
        if [ -f "$MANIFEST_FILE" ]; then
          echo "❌ Error: Manifest already exists: $MANIFEST_FILE"
          exit 1
        fi
        
        # Create manifest
        cat > "$MANIFEST_FILE" <<EOF
        ---
        # Release ${VERSION}
        # Generated by Tekton create-release pipeline
        version: "${VERSION}"
        created: "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        created_by: "tekton-pipeline"
        description: "$(params.DESCRIPTION)"
        
        components:
          aap_configuration:
            repository: "https://github.com/djdanielsson/rh1-aap-config-as-code.git"
            commit: "$(params.AAP_CONFIG_COMMIT)"
            branch: "main"
        
          collections:
            repository: "https://github.com/djdanielsson/rh1-custom-collection.git"
            commit: "$(params.COLLECTION_COMMIT)"
            branch: "main"
        
          execution_environment:
            registry: "quay.io"
            repository: "myorg/custom-ee"
            tag: "$(params.EE_TAG)"
            digest: "$(params.EE_DIGEST)"
        
        environments:
          dev:
            deployed: null
            validated: false
            validated_by: null
          qa:
            deployed: null
            validated: false
            validated_by: null
          prod:
            deployed: null
            validated: false
            validated_by: null
        
        validation:
          tests_required:
            - smoke-tests
            - integration-tests
            - security-scan
          tests_passed: []
          approval_required: true
          approved_by: null
          approved_at: null
        
        metadata:
          pipeline_run: "$(context.pipelineRun.name)"
          task_run: "$(context.taskRun.name)"
        EOF
        
        echo "✅ Created manifest: $MANIFEST_FILE"
        echo "$MANIFEST_FILE" > $(results.manifest-path.path)


