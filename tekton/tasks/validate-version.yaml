---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: validate-version
  labels:
    app.kubernetes.io/component: release-management
spec:
  description: |
    Validates version string follows YY.MM.DD.PATCH CalVer format.
  params:
    - name: VERSION
      type: string
      description: Version string to validate (e.g., 25.01.05.0)
  results:
    - name: valid
      description: Whether the version is valid (true/false)
    - name: year
      description: Extracted year component
    - name: month
      description: Extracted month component
    - name: day
      description: Extracted day component
    - name: patch
      description: Extracted patch component
  steps:
    - name: validate
      image: registry.access.redhat.com/ubi9/ubi-minimal:latest
      script: |
        #!/usr/bin/env bash
        set -e
        
        VERSION="$(params.VERSION)"
        echo "Validating version: $VERSION"
        
        # Regex for YY.MM.DD.PATCH format
        REGEX='^[0-9]{2}\.(0[1-9]|1[0-2])\.(0[1-9]|[12][0-9]|3[01])\.[0-9]+$'
        
        if [[ ! "$VERSION" =~ $REGEX ]]; then
          echo "❌ Invalid version format: $VERSION"
          echo "Expected: YY.MM.DD.PATCH (e.g., 25.01.05.0)"
          echo "false" > $(results.valid.path)
          exit 1
        fi
        
        # Extract components
        IFS='.' read -r YEAR MONTH DAY PATCH <<< "$VERSION"
        
        echo "✅ Valid version: $VERSION"
        echo "  Year:  $YEAR"
        echo "  Month: $MONTH"
        echo "  Day:   $DAY"
        echo "  Patch: $PATCH"
        
        # Write results
        echo "true" > $(results.valid.path)
        echo "$YEAR" > $(results.year.path)
        echo "$MONTH" > $(results.month.path)
        echo "$DAY" > $(results.day.path)
        echo "$PATCH" > $(results.patch.path)

