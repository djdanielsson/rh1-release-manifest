---
# yaml-language-server: $schema=https://raw.githubusercontent.com/tektoncd/pipeline/main/pkg/apis/pipeline/v1/swagger.json
#
# Rollback Pipeline
# This pipeline is triggered manually via tkn CLI or Tekton Dashboard
# It rolls back an environment to a previous release version
#
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: release-manifest-rollback
  annotations:
    # Manual trigger only - use tkn pipeline start or Tekton Dashboard
    pipelinesascode.tekton.dev/on-event: "[manual]"
    pipelinesascode.tekton.dev/task: "[git-clone]"
    pipelinesascode.tekton.dev/max-keep-runs: "10"
spec:
  params:
    - name: repo_url
      value: "{{ repo_url }}"
    - name: revision
      value: "{{ revision }}"
    - name: target_version
      value: "{{ target_version }}"
    - name: environment
      value: "{{ environment }}"
    - name: reason
      value: "{{ reason }}"
    - name: dry_run
      value: "{{ dry_run }}"
  pipelineSpec:
    params:
      - name: repo_url
        type: string
      - name: revision
        type: string
      - name: target_version
        type: string
        description: Version to roll back to (YY.M.D-PATCH format)
      - name: environment
        type: string
        description: Target environment (dev, qa, prod)
      - name: reason
        type: string
        description: Reason for rollback
        default: "Manual rollback requested"
      - name: dry_run
        type: string
        description: If 'true', only validate without applying changes
        default: "false"
    workspaces:
      - name: source
        description: Workspace for release-manifest repo
      - name: aap-config
        description: Workspace for aap-config-as-code checkout
    results:
      - name: previous-version
        description: Version that was replaced
        value: $(tasks.validate-and-get-info.results.previous-version)

    tasks:
      - name: fetch-repository
        taskRef:
          name: git-clone
          kind: ClusterTask
        workspaces:
          - name: output
            workspace: source
        params:
          - name: url
            value: $(params.repo_url)
          - name: revision
            value: $(params.revision)
          - name: depth
            value: "0"

      - name: validate-environment
        runAfter:
          - fetch-repository
        taskSpec:
          params:
            - name: ENVIRONMENT
              type: string
          results:
            - name: valid
              description: Whether the environment is valid
          steps:
            - name: validate
              image: registry.access.redhat.com/ubi9/ubi-minimal:latest
              script: |
                #!/usr/bin/env bash
                set -e

                ENV="$(params.ENVIRONMENT)"

                case "$ENV" in
                  dev|qa|prod)
                    echo "✅ Valid environment: $ENV"
                    echo "true" > $(results.valid.path)
                    ;;
                  *)
                    echo "❌ Invalid environment: $ENV"
                    echo "Must be one of: dev, qa, prod"
                    echo "false" > $(results.valid.path)
                    exit 1
                    ;;
                esac
        params:
          - name: ENVIRONMENT
            value: $(params.environment)

      - name: validate-and-get-info
        runAfter:
          - validate-environment
        workspaces:
          - name: source
            workspace: source
        taskSpec:
          params:
            - name: VERSION
              type: string
            - name: ENVIRONMENT
              type: string
          workspaces:
            - name: source
          results:
            - name: manifest-path
              description: Path to manifest file
            - name: aap-commit
              description: AAP config commit from manifest
            - name: previous-version
              description: Current deployed version
          steps:
            - name: validate
              image: ghcr.io/ansible/community-ansible-dev-tools:v25.9.0
              workingDir: $(workspaces.source.path)
              script: |
                #!/usr/bin/env bash
                set -e

                TARGET_MANIFEST="releases/release-$(params.VERSION).yaml"

                if [ ! -f "$TARGET_MANIFEST" ]; then
                  echo "❌ Release manifest not found: $TARGET_MANIFEST"
                  echo ""
                  echo "Available releases:"
                  ls -la releases/ | grep -E "release-[0-9]" || echo "  No releases found"
                  exit 1
                fi

                echo "✅ Found manifest: $TARGET_MANIFEST"
                echo "$TARGET_MANIFEST" > $(results.manifest-path.path)

                # Extract AAP commit
                AAP_COMMIT=$(yq eval '.components.aap_configuration.commit' "$TARGET_MANIFEST")
                echo "AAP Config commit: $AAP_COMMIT"
                echo -n "$AAP_COMMIT" > $(results.aap-commit.path)

                # Find current deployed version
                echo "Finding current deployed version..."
                CURRENT=""
                CURRENT_TIME=""
                for manifest in releases/release-*.yaml; do
                  if [ -f "$manifest" ]; then
                    DEP_TIME=$(yq eval ".environments.$(params.ENVIRONMENT).deployed" "$manifest")
                    if [ "$DEP_TIME" != "null" ]; then
                      VERSION=$(yq eval ".version" "$manifest")
                      if [ -z "$CURRENT_TIME" ] || [[ "$DEP_TIME" > "$CURRENT_TIME" ]]; then
                        CURRENT="$VERSION"
                        CURRENT_TIME="$DEP_TIME"
                      fi
                    fi
                  fi
                done

                if [ -n "$CURRENT" ]; then
                  echo "Current version: $CURRENT (deployed at $CURRENT_TIME)"
                  echo -n "$CURRENT" > $(results.previous-version.path)
                else
                  echo "No current version found"
                  echo -n "none" > $(results.previous-version.path)
                fi
        params:
          - name: VERSION
            value: $(params.target_version)
          - name: ENVIRONMENT
            value: $(params.environment)

      - name: dry-run-check
        runAfter:
          - validate-and-get-info
        when:
          - input: $(params.dry_run)
            operator: in
            values: ["true"]
        taskSpec:
          params:
            - name: VERSION
              type: string
            - name: ENVIRONMENT
              type: string
            - name: MANIFEST_PATH
              type: string
            - name: PREVIOUS_VERSION
              type: string
          steps:
            - name: dry-run-summary
              image: registry.access.redhat.com/ubi9/ubi-minimal:latest
              script: |
                #!/usr/bin/env bash

                echo ""
                echo "╔════════════════════════════════════════════════════════════════════╗"
                echo "║                    DRY RUN - NO CHANGES MADE                       ║"
                echo "╠════════════════════════════════════════════════════════════════════╣"
                echo "║  Would roll back:                                                  ║"
                echo "║    Environment:       $(params.ENVIRONMENT)                        ║"
                echo "║    From Version:      $(params.PREVIOUS_VERSION)                   ║"
                echo "║    To Version:        $(params.VERSION)                            ║"
                echo "║    Manifest:          $(params.MANIFEST_PATH)                      ║"
                echo "╚════════════════════════════════════════════════════════════════════╝"
                echo ""
                echo "To execute rollback, run again with dry_run=false"
        params:
          - name: VERSION
            value: $(params.target_version)
          - name: ENVIRONMENT
            value: $(params.environment)
          - name: MANIFEST_PATH
            value: $(tasks.validate-and-get-info.results.manifest-path)
          - name: PREVIOUS_VERSION
            value: $(tasks.validate-and-get-info.results.previous-version)

      - name: clone-aap-config
        runAfter:
          - validate-and-get-info
        when:
          - input: $(params.dry_run)
            operator: notin
            values: ["true"]
        taskRef:
          name: git-clone
          kind: ClusterTask
        workspaces:
          - name: output
            workspace: aap-config
        params:
          - name: url
            value: https://github.com/djdanielsson/rh1-aap-config-as-code.git
          - name: revision
            value: $(tasks.validate-and-get-info.results.aap-commit)
          - name: depth
            value: "1"

      - name: rollback
        runAfter:
          - clone-aap-config
        when:
          - input: $(params.dry_run)
            operator: notin
            values: ["true"]
        workspaces:
          - name: source
            workspace: source
          - name: aap-config
            workspace: aap-config
        taskSpec:
          params:
            - name: VERSION
              type: string
            - name: ENVIRONMENT
              type: string
            - name: REASON
              type: string
            - name: PREVIOUS_VERSION
              type: string
          workspaces:
            - name: source
            - name: aap-config
          results:
            - name: rollback-time
              description: Timestamp of rollback
          steps:
            - name: apply-configuration
              image: ghcr.io/ansible/community-ansible-dev-tools:v25.9.0
              workingDir: $(workspaces.aap-config.path)
              env:
                - name: CONTROLLER_HOST
                  valueFrom:
                    secretKeyRef:
                      name: aap-$(params.ENVIRONMENT)-credentials
                      key: host
                - name: CONTROLLER_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: aap-$(params.ENVIRONMENT)-credentials
                      key: password
                - name: CONTROLLER_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: aap-$(params.ENVIRONMENT)-credentials
                      key: username
                      optional: true
              script: |
                #!/usr/bin/env bash
                set -e

                echo "╔════════════════════════════════════════════════════════════════════╗"
                echo "║  Rolling back $(params.ENVIRONMENT) to $(params.VERSION)           ║"
                echo "╚════════════════════════════════════════════════════════════════════╝"

                # Install collections
                ansible-galaxy collection install -r collections/requirements.yml

                # Run playbook for target environment
                ansible-playbook playbooks/playbook.yml \
                  --limit aap_$(params.ENVIRONMENT) \
                  -e "release_version=$(params.VERSION)" \
                  -e "is_rollback=true"

                echo "✅ Rollback configuration applied"

                date -u +%Y-%m-%dT%H:%M:%SZ > $(results.rollback-time.path)

            - name: record-rollback
              image: ghcr.io/ansible/community-ansible-dev-tools:v25.9.0
              workingDir: $(workspaces.source.path)
              script: |
                #!/usr/bin/env bash
                set -e

                MANIFEST="releases/release-$(params.VERSION).yaml"
                ROLLBACK_TIME=$(cat $(results.rollback-time.path))

                echo "Recording rollback in manifest..."

                # Update deployment timestamp
                yq eval -i ".environments.$(params.ENVIRONMENT).deployed = \"$ROLLBACK_TIME\"" "$MANIFEST"

                # Add rollback history entry
                yq eval -i ".rollback_history += [{
                  \"timestamp\": \"$ROLLBACK_TIME\",
                  \"environment\": \"$(params.ENVIRONMENT)\",
                  \"from_version\": \"$(params.PREVIOUS_VERSION)\",
                  \"reason\": \"$(params.REASON)\",
                  \"pipeline_run\": \"$(context.pipelineRun.name)\"
                }]" "$MANIFEST"

                echo "╔════════════════════════════════════════════════════════════════════╗"
                echo "║  ✅ ROLLBACK COMPLETE                                              ║"
                echo "║                                                                    ║"
                echo "║  Environment: $(params.ENVIRONMENT)                                ║"
                echo "║  From:        $(params.PREVIOUS_VERSION)                           ║"
                echo "║  To:          $(params.VERSION)                                    ║"
                echo "║  Time:        $ROLLBACK_TIME                                       ║"
                echo "║  Reason:      $(params.REASON)                                     ║"
                echo "╚════════════════════════════════════════════════════════════════════╝"
        params:
          - name: VERSION
            value: $(params.target_version)
          - name: ENVIRONMENT
            value: $(params.environment)
          - name: REASON
            value: $(params.reason)
          - name: PREVIOUS_VERSION
            value: $(tasks.validate-and-get-info.results.previous-version)

    finally:
      - name: notify
        taskSpec:
          params:
            - name: VERSION
              type: string
            - name: ENVIRONMENT
              type: string
            - name: REASON
              type: string
          steps:
            - name: summary
              image: registry.access.redhat.com/ubi9/ubi-minimal:latest
              script: |
                #!/usr/bin/env bash

                echo ""
                echo "╔════════════════════════════════════════════════════════════════════╗"
                echo "║                      ROLLBACK PIPELINE COMPLETE                    ║"
                echo "╠════════════════════════════════════════════════════════════════════╣"
                echo "║  Target Version: $(params.VERSION)                                 ║"
                echo "║  Environment:    $(params.ENVIRONMENT)                             ║"
                echo "║  Reason:         $(params.REASON)                                  ║"
                echo "║  Status:         $(context.pipelineRun.status)                     ║"
                echo "╚════════════════════════════════════════════════════════════════════╝"
                echo ""
                echo "Next steps:"
                echo "  1. Verify the rollback in AAP UI"
                echo "  2. Run smoke tests"
                echo "  3. Push manifest changes: git push origin main"
        params:
          - name: VERSION
            value: $(params.target_version)
          - name: ENVIRONMENT
            value: $(params.environment)
          - name: REASON
            value: $(params.reason)

  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
    - name: aap-config
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 500Mi
