apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: release-manifest
  annotations:
    pipelinesascode.tekton.dev/task-1: "[git-clone]"
    pipelinesascode.tekton.dev/on-event: "[push]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
spec:
  workspaces:
  - name: repos-workspace
    volumeClaimTemplate:
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi

  pipelineSpec:
    workspaces:
    - name: repos-workspace
    tasks:
      - name: fetch-rh1-release-manifest-repo-source
        taskRef:
          name: git-clone
        params:
        - name: url
          value: "{{ repo_url }}"
        - name: revision
          value: "{{ revision }}"
        - name: verbose
          value: "true"
        - name: subdirectory
          value: "rh1-release-manifest"
        workspaces:
        - name: output
          workspace: repos-workspace

      - name: fetch-rh1-custom-collection-repo-source
        runAfter:
        - fetch-rh1-release-manifest-repo-source
        taskRef:
          name: git-clone
        params:
        - name: url
          value: "https://github.com/djdanielsson/rh1-custom-collection.git"
        - name: revision
          value: "main"
        - name: verbose
          value: "true"
        - name: subdirectory
          value: "rh1-custom-collection"
        workspaces:
        - name: output
          workspace: repos-workspace

      - name: fetch-rh1-automation-playbooks-repo-source
        runAfter:
        - fetch-rh1-custom-collection-repo-source
        taskRef:
          name: git-clone
        params:
        - name: url
          value: "https://github.com/djdanielsson/rh1-automation-playbooks.git"
        - name: revision
          value: "main"
        - name: verbose
          value: "true"
        - name: subdirectory
          value: "rh1-automation-playbooks"
        workspaces:
        - name: output
          workspace: repos-workspace

      - name: fetch-rh1-ee-repo-source
        runAfter:
        - fetch-rh1-automation-playbooks-repo-source
        taskRef:
          name: git-clone
        params:
        - name: url
          value: "https://github.com/djdanielsson/rh1-ee.git"
        - name: revision
          value: "main"
        - name: verbose
          value: "true"
        - name: subdirectory
          value: "rh1-ee"
        workspaces:
        - name: output
          workspace: repos-workspace

      - name: fetch-rh1-aap-config-as-code-repo-source
        runAfter:
        - fetch-rh1-ee-repo-source
        taskRef:
          name: git-clone
        params:
        - name: url
          value: "https://github.com/djdanielsson/rh1-aap-config-as-code.git"
        - name: revision
          value: "main"
        - name: verbose
          value: "true"
        - name: subdirectory
          value: "rh1-aap-config-as-code"
        workspaces:
        - name: output
          workspace: repos-workspace