---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: release-promote
  annotations:
    pipelinesascode.tekton.dev/on-event: "[manual]"
    pipelinesascode.tekton.dev/task: "[git-clone]"
    pipelinesascode.tekton.dev/max-keep-runs: "10"
spec:
  params:
    - name: repo_url
      value: "{{ repo_url }}"
    - name: revision
      value: "{{ revision }}"
    - name: version
      value: "{{ version }}"
    - name: environment
      value: "{{ environment }}"
  pipelineSpec:
    params:
      - name: repo_url
      - name: revision
      - name: version
        description: Release version to deploy (YY.M.D-PATCH)
      - name: environment
        description: Target environment (dev, qa, prod)
    workspaces:
      - name: source
      - name: aap-config
    tasks:
      - name: clone-manifest-repo
        taskRef:
          name: git-clone
          kind: ClusterTask
        workspaces:
          - name: output
            workspace: source
        params:
          - name: url
            value: $(params.repo_url)
          - name: revision
            value: $(params.revision)

      - name: read-release-manifest
        runAfter: [clone-manifest-repo]
        workspaces:
          - name: source
            workspace: source
        taskSpec:
          params:
            - name: VERSION
            - name: ENVIRONMENT
          workspaces:
            - name: source
          results:
            - name: manifest-path
            - name: version-mappings
            - name: ee-tag
            - name: playbooks-tag
          steps:
            - name: read
              image: ghcr.io/ansible/community-ansible-dev-tools:v25.9.0
              workingDir: $(workspaces.source.path)
              script: |
                #!/usr/bin/env bash
                set -e
                VERSION="$(params.VERSION)"
                ENV="$(params.ENVIRONMENT)"
                MANIFEST="releases/release-${VERSION}.yaml"
                if [ ! -f "$MANIFEST" ]; then
                  echo "Manifest not found: $MANIFEST"
                  exit 1
                fi
                echo -n "$MANIFEST" > $(results.manifest-path.path)
                EE_TAG=$(yq eval '.components.execution_environment.tag' "$MANIFEST")
                PLAYBOOKS_TAG=$(yq eval '.components.playbooks.tag' "$MANIFEST")
                echo -n "$EE_TAG" > $(results.ee-tag.path)
                echo -n "$PLAYBOOKS_TAG" > $(results.playbooks-tag.path)
                yq eval '.version_mappings' "$MANIFEST" -o=json > $(results.version-mappings.path)
                echo "Read manifest for $VERSION, deploying to $ENV"
        params:
          - name: VERSION
            value: $(params.version)
          - name: ENVIRONMENT
            value: $(params.environment)

      - name: clone-aap-config
        runAfter: [read-release-manifest]
        taskRef:
          name: git-clone
          kind: ClusterTask
        workspaces:
          - name: output
            workspace: aap-config
        params:
          - name: url
            value: https://github.com/djdanielsson/rh1-aap-config-as-code.git
          - name: revision
            value: main

      - name: update-aap-config-files
        runAfter: [clone-aap-config]
        workspaces:
          - name: source
            workspace: source
          - name: aap-config
            workspace: aap-config
        taskSpec:
          params:
            - name: VERSION
            - name: ENVIRONMENT
            - name: MANIFEST_PATH
          workspaces:
            - name: source
            - name: aap-config
          steps:
            - name: update-files
              image: ghcr.io/ansible/community-ansible-dev-tools:v25.9.0
              script: |
                #!/usr/bin/env bash
                set -e
                VERSION="$(params.VERSION)"
                ENV="$(params.ENVIRONMENT)"
                MANIFEST="$(workspaces.source.path)/$(params.MANIFEST_PATH)"
                AAP_CONFIG="$(workspaces.aap-config.path)"
                echo "Updating aap-config-as-code files for $ENV with version $VERSION"
                cd "$AAP_CONFIG"
                for file in inventory/group_vars/all/jt_*.yml; do
                  if [ -f "$file" ]; then
                    FILENAME=$(basename "$file" .yml)
                    PROJECT_VER=$(yq eval ".version_mappings.$FILENAME.project_version // \"$VERSION\"" "$MANIFEST")
                    EE_VER=$(yq eval ".version_mappings.$FILENAME.ee_version // \"$VERSION\"" "$MANIFEST")
                    echo "Updating $FILENAME: project=$PROJECT_VER, ee=$EE_VER"
                    sed -i "s/release_project_.*_version\": \"[^\"]*\"/release_project_version\": \"$PROJECT_VER\"/" "$file" 2>/dev/null || true
                    sed -i "s/release_ee_.*_version\": \"[^\"]*\"/release_ee_version\": \"$EE_VER\"/" "$file" 2>/dev/null || true
                    yq eval -i "(.[] | select(.scm_branch) | .scm_branch) = \"$PROJECT_VER\"" "$file" 2>/dev/null || true
                    yq eval -i "(.[] | select(.image) | .image) |= sub(\":[^:]+$\"; \":$EE_VER\")" "$file" 2>/dev/null || true
                  fi
                done
                if [ "$ENV" != "dev" ]; then
                  for file in inventory/group_vars/all/jt_*.yml; do
                    yq eval -i "(.[] | select(.scm_update_on_launch) | .scm_update_on_launch) = false" "$file" 2>/dev/null || true
                  done
                fi
                git config user.name "Tekton"
                git config user.email "tekton@pipeline"
                git add .
                git commit -m "Promote $VERSION to $ENV" || true
                echo "Files updated for $ENV"
        params:
          - name: VERSION
            value: $(params.version)
          - name: ENVIRONMENT
            value: $(params.environment)
          - name: MANIFEST_PATH
            value: $(tasks.read-release-manifest.results.manifest-path)

      - name: apply-to-aap
        runAfter: [update-aap-config-files]
        workspaces:
          - name: aap-config
            workspace: aap-config
        taskSpec:
          params:
            - name: VERSION
            - name: ENVIRONMENT
          workspaces:
            - name: aap-config
          results:
            - name: deployed-at
          steps:
            - name: apply
              image: ghcr.io/ansible/community-ansible-dev-tools:v25.9.0
              workingDir: $(workspaces.aap-config.path)
              env:
                - name: CONTROLLER_HOST
                  valueFrom:
                    secretKeyRef:
                      name: aap-$(params.ENVIRONMENT)-credentials
                      key: host
                - name: CONTROLLER_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: aap-$(params.ENVIRONMENT)-credentials
                      key: password
                - name: CONTROLLER_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: aap-$(params.ENVIRONMENT)-credentials
                      key: username
                      optional: true
              script: |
                #!/usr/bin/env bash
                set -e
                VERSION="$(params.VERSION)"
                ENV="$(params.ENVIRONMENT)"
                echo "Applying $VERSION to $ENV"
                ansible-galaxy collection install -r collections/requirements.yml
                ansible-playbook playbooks/playbook.yml --limit aap_${ENV}
                date -u +%Y-%m-%dT%H:%M:%SZ > $(results.deployed-at.path)
                echo "Applied to $ENV"
        params:
          - name: VERSION
            value: $(params.version)
          - name: ENVIRONMENT
            value: $(params.environment)

      - name: update-env-tracking
        runAfter: [apply-to-aap]
        workspaces:
          - name: source
            workspace: source
        taskSpec:
          params:
            - name: VERSION
            - name: ENVIRONMENT
            - name: MANIFEST_PATH
            - name: DEPLOYED_AT
          workspaces:
            - name: source
          steps:
            - name: update
              image: ghcr.io/ansible/community-ansible-dev-tools:v25.9.0
              workingDir: $(workspaces.source.path)
              script: |
                #!/usr/bin/env bash
                set -e
                VERSION="$(params.VERSION)"
                ENV="$(params.ENVIRONMENT)"
                MANIFEST="$(params.MANIFEST_PATH)"
                DEPLOYED="$(params.DEPLOYED_AT)"
                yq eval -i ".environments.$ENV.deployed = \"$DEPLOYED\"" "$MANIFEST"
                yq eval -i ".environments.$ENV.validated = false" "$MANIFEST"
                ENV_CONFIG="config/environments.yml"
                yq eval -i ".environments.$ENV.release_version = \"$VERSION\"" "$ENV_CONFIG"
                yq eval -i ".environments.$ENV.deployed_at = \"$DEPLOYED\"" "$ENV_CONFIG"
                git config user.name "Tekton"
                git config user.email "tekton@pipeline"
                git add "$MANIFEST" "$ENV_CONFIG"
                git commit -m "Promoted $VERSION to $ENV"
                echo "Tracking updated"
        params:
          - name: VERSION
            value: $(params.version)
          - name: ENVIRONMENT
            value: $(params.environment)
          - name: MANIFEST_PATH
            value: $(tasks.read-release-manifest.results.manifest-path)
          - name: DEPLOYED_AT
            value: $(tasks.apply-to-aap.results.deployed-at)

    finally:
      - name: summary
        taskSpec:
          params:
            - name: VERSION
            - name: ENVIRONMENT
          steps:
            - name: print
              image: registry.access.redhat.com/ubi9/ubi-minimal:latest
              script: |
                echo "Promoted $(params.VERSION) to $(params.ENVIRONMENT)"
        params:
          - name: VERSION
            value: $(params.version)
          - name: ENVIRONMENT
            value: $(params.environment)

  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 1Gi
    - name: aap-config
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 500Mi
