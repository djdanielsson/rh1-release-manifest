---
# yaml-language-server: $schema=https://raw.githubusercontent.com/tektoncd/pipeline/main/pkg/apis/pipeline/v1/swagger.json
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: release-manifest-pr-validation
  annotations:
    pipelinesascode.tekton.dev/on-event: "[pull_request]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/task: "[git-clone]"
    pipelinesascode.tekton.dev/max-keep-runs: "5"
spec:
  params:
    - name: repo_url
      value: "{{ repo_url }}"
    - name: revision
      value: "{{ revision }}"
  pipelineSpec:
    params:
      - name: repo_url
        type: string
      - name: revision
        type: string
    workspaces:
      - name: source
    tasks:
      - name: fetch-repository
        taskRef:
          name: git-clone
          kind: ClusterTask
        workspaces:
          - name: output
            workspace: source
        params:
          - name: url
            value: $(params.repo_url)
          - name: revision
            value: $(params.revision)
          - name: depth
            value: "0"

      - name: validate-yaml-syntax
        runAfter:
          - fetch-repository
        workspaces:
          - name: source
            workspace: source
        taskSpec:
          workspaces:
            - name: source
          steps:
            - name: yaml-lint
              image: ghcr.io/ansible/community-ansible-dev-tools:v25.9.0
              workingDir: $(workspaces.source.path)
              script: |
                #!/usr/bin/env bash
                set -e

                echo "╔════════════════════════════════════════════════════════════════════╗"
                echo "║                    YAML SYNTAX VALIDATION                          ║"
                echo "╚════════════════════════════════════════════════════════════════════╝"

                # Validate all YAML files
                yamllint -d relaxed releases/ schemas/ templates/ || true

                echo "✅ YAML syntax validation complete"

      - name: validate-manifest-schema
        runAfter:
          - fetch-repository
        workspaces:
          - name: source
            workspace: source
        taskSpec:
          workspaces:
            - name: source
          steps:
            - name: validate-schema
              image: ghcr.io/ansible/community-ansible-dev-tools:v25.9.0
              workingDir: $(workspaces.source.path)
              script: |
                #!/usr/bin/env bash
                set -e

                echo "╔════════════════════════════════════════════════════════════════════╗"
                echo "║                    MANIFEST SCHEMA VALIDATION                      ║"
                echo "╚════════════════════════════════════════════════════════════════════╝"

                # Run the validation script if it exists
                if [ -f "scripts/validate-manifest-schema.py" ]; then
                  python scripts/validate-manifest-schema.py releases/
                else
                  echo "Validation script not found, skipping schema validation"
                fi

                echo "✅ Schema validation complete"

      - name: validate-release-manifests
        runAfter:
          - fetch-repository
        workspaces:
          - name: source
            workspace: source
        taskSpec:
          workspaces:
            - name: source
          results:
            - name: valid
              description: Whether all manifests are valid
          steps:
            - name: validate-manifests
              image: ghcr.io/ansible/community-ansible-dev-tools:v25.9.0
              workingDir: $(workspaces.source.path)
              script: |
                #!/usr/bin/env bash
                set -e

                echo "╔════════════════════════════════════════════════════════════════════╗"
                echo "║                    RELEASE MANIFEST VALIDATION                     ║"
                echo "╚════════════════════════════════════════════════════════════════════╝"

                VALID=true

                for manifest in releases/release-*.yaml; do
                  if [ -f "$manifest" ]; then
                    echo "Validating: $manifest"

                    # Check required fields
                    VERSION=$(yq eval '.version' "$manifest")
                    AAP_COMMIT=$(yq eval '.components.aap_configuration.commit' "$manifest")
                    COLLECTION_COMMIT=$(yq eval '.components.collections.commit' "$manifest")
                    EE_DIGEST=$(yq eval '.components.execution_environment.digest' "$manifest")

                    # Validate version format (YY.M.D-PATCH)
                    if [[ ! "$VERSION" =~ ^[0-9]{2}\.(1[0-2]|[1-9])\.(3[01]|[12][0-9]|[1-9])-[0-9]+$ ]]; then
                      echo "  ❌ Invalid version format: $VERSION"
                      VALID=false
                    else
                      echo "  ✅ Version: $VERSION"
                    fi

                    # Validate commit SHA format (40 chars)
                    if [[ ! "$AAP_COMMIT" =~ ^[a-f0-9]{40}$ ]] && [ "$AAP_COMMIT" != "HEAD" ]; then
                      echo "  ❌ Invalid AAP commit SHA: $AAP_COMMIT"
                      VALID=false
                    else
                      echo "  ✅ AAP commit: ${AAP_COMMIT:0:8}..."
                    fi

                    if [[ ! "$COLLECTION_COMMIT" =~ ^[a-f0-9]{40}$ ]] && [ "$COLLECTION_COMMIT" != "HEAD" ]; then
                      echo "  ❌ Invalid collection commit SHA: $COLLECTION_COMMIT"
                      VALID=false
                    else
                      echo "  ✅ Collection commit: ${COLLECTION_COMMIT:0:8}..."
                    fi

                    # Validate EE digest (sha256:64chars)
                    if [[ ! "$EE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
                      echo "  ⚠️  Warning: Non-standard EE digest format: $EE_DIGEST"
                    else
                      echo "  ✅ EE digest: ${EE_DIGEST:0:19}..."
                    fi

                    # Check for forbidden patterns in production
                    if echo "$EE_DIGEST" | grep -qE "latest|main|master"; then
                      echo "  ❌ Forbidden tag in EE digest (no :latest/:main/:master allowed)"
                      VALID=false
                    fi

                    echo ""
                  fi
                done

                if [ "$VALID" = true ]; then
                  echo "✅ All manifest validations passed"
                  echo "true" > $(results.valid.path)
                else
                  echo "❌ Some manifest validations failed"
                  echo "false" > $(results.valid.path)
                  exit 1
                fi

      - name: check-duplicates
        runAfter:
          - fetch-repository
        workspaces:
          - name: source
            workspace: source
        taskSpec:
          workspaces:
            - name: source
          steps:
            - name: check-duplicate-versions
              image: ghcr.io/ansible/community-ansible-dev-tools:v25.9.0
              workingDir: $(workspaces.source.path)
              script: |
                #!/usr/bin/env bash
                set -e

                echo "╔════════════════════════════════════════════════════════════════════╗"
                echo "║                    DUPLICATE VERSION CHECK                         ║"
                echo "╚════════════════════════════════════════════════════════════════════╝"

                # Extract all versions and check for duplicates
                VERSIONS=""
                for manifest in releases/release-*.yaml; do
                  if [ -f "$manifest" ]; then
                    VERSION=$(yq eval '.version' "$manifest")
                    VERSIONS="$VERSIONS $VERSION"
                  fi
                done

                # Check for duplicates
                DUPLICATES=$(echo "$VERSIONS" | tr ' ' '\n' | sort | uniq -d)

                if [ -n "$DUPLICATES" ]; then
                  echo "❌ Duplicate versions found:"
                  echo "$DUPLICATES"
                  exit 1
                fi

                echo "✅ No duplicate versions found"
                echo "Versions present: $VERSIONS"

    finally:
      - name: report-status
        taskSpec:
          steps:
            - name: summary
              image: registry.access.redhat.com/ubi9/ubi-minimal:latest
              script: |
                #!/usr/bin/env bash

                echo ""
                echo "╔════════════════════════════════════════════════════════════════════╗"
                echo "║              RELEASE MANIFEST PR VALIDATION COMPLETE               ║"
                echo "╠════════════════════════════════════════════════════════════════════╣"
                echo "║  Pipeline:    release-manifest-pr-validation                       ║"
                echo "║  Status:      $(context.pipelineRun.status)                        ║"
                echo "╚════════════════════════════════════════════════════════════════════╝"

  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
